# Shared resources for this project, raised by Kingdom IDE.
#
# One set, shared by every agent working on the project -- not one per agent.
# Kingdom starts these while a plan is live, stops them when the last one
# finishes, and keeps the volumes either way. Reach them at localhost on the
# ports below; a plan on the machine's own network is told the container's
# address instead.

# The application database. Kingdom knows postgres, so it supplies the data
# directory and the POSTGRES_PASSWORD the image needs to boot: the connection
# string is postgres://postgres:postgres@localhost:5432/postgres.
[[service]]
type   = "docker"
name   = "db"
image  = "postgres:16"
port   = 5432
volume = "mommys-heart-db"
