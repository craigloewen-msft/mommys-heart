<!--
  Mommy's Heart Foundation — Document Search Chat Widget
  ------------------------------------------------------------------
  HOW TO ADD THIS TO SQUARESPACE:
    1. In Squarespace go to:  Settings → Advanced → Code Injection → FOOTER
       (this makes the chat button appear on every page).
       To add it to a single page instead, edit that page and add a "Code" block.
    2. Paste this entire snippet in and save.
    3. The chat button (💬) appears in the bottom-right of the site.

  Already configured for this deployment:
    - API:     https://mommys-heart-api-ehh4aub4auadb2a7.westus-01.azurewebsites.net
    - Website: https://www.mommysheartfoundation.com
  The API must have ALLOWED_ORIGINS set to include https://www.mommysheartfoundation.com
  (see the README) or the browser will block the requests via CORS.

  Notes:
    - Self-contained: no external libraries, no build step.
    - Everything is scoped under the "mh-chat" prefix to avoid clashing
      with Squarespace styles.
-->
<script>
  // Deployed API URL (no trailing slash):
  window.CHAT_API_BASE = "https://mommys-heart-api-ehh4aub4auadb2a7.westus-01.azurewebsites.net";
</script>

<style>
  #mh-chat-launcher {
    position: fixed; bottom: 24px; right: 24px; z-index: 99999;
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: #c2185b; color: #fff; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    font-size: 26px; line-height: 60px; text-align: center;
    transition: transform .15s ease;
  }
  #mh-chat-launcher:hover { transform: scale(1.06); }

  #mh-chat-panel {
    position: fixed; bottom: 96px; right: 24px; z-index: 99999;
    width: 370px; max-width: calc(100vw - 32px);
    height: 540px; max-height: calc(100vh - 130px);
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
    display: none; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #mh-chat-panel.mh-open { display: flex; }

  #mh-chat-header {
    background: #c2185b; color: #fff; padding: 14px 16px;
    font-weight: 600; font-size: 15px; display: flex;
    justify-content: space-between; align-items: center;
  }
  #mh-chat-header .mh-close {
    cursor: pointer; background: none; border: none; color: #fff;
    font-size: 20px; line-height: 1;
  }

  #mh-chat-log {
    flex: 1; overflow-y: auto; padding: 14px;
    background: #faf7f8; font-size: 14px; line-height: 1.45;
  }
  .mh-msg { margin-bottom: 12px; display: flex; }
  .mh-msg.mh-user { justify-content: flex-end; }
  .mh-bubble {
    padding: 9px 12px; border-radius: 12px; max-width: 85%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .mh-user .mh-bubble { background: #c2185b; color: #fff; border-bottom-right-radius: 3px; }
  .mh-bot .mh-bubble  { background: #fff; color: #222; border: 1px solid #eee; border-bottom-left-radius: 3px; }

  .mh-sources { margin-top: 8px; font-size: 12px; }
  .mh-sources details { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 6px 9px; margin-top: 5px; }
  .mh-sources summary { cursor: pointer; color: #c2185b; font-weight: 600; }
  .mh-sources .mh-snippet { color: #555; margin-top: 5px; }

  #mh-chat-input-row { display: flex; border-top: 1px solid #eee; padding: 10px; gap: 8px; background: #fff; }
  #mh-chat-input {
    flex: 1; resize: none; border: 1px solid #ddd; border-radius: 10px;
    padding: 9px 11px; font-size: 14px; font-family: inherit; max-height: 100px;
  }
  #mh-chat-send {
    border: none; background: #c2185b; color: #fff; border-radius: 10px;
    padding: 0 16px; cursor: pointer; font-weight: 600;
  }
  #mh-chat-send:disabled { opacity: .5; cursor: default; }
  .mh-typing { color: #999; font-style: italic; }
</style>

<button id="mh-chat-launcher" aria-label="Open chat">💬</button>

<div id="mh-chat-panel" role="dialog" aria-label="Document search chat">
  <div id="mh-chat-header">
    <span>Ask a question</span>
    <button class="mh-close" aria-label="Close chat">×</button>
  </div>
  <div id="mh-chat-log"></div>
  <div id="mh-chat-input-row">
    <textarea id="mh-chat-input" rows="1" placeholder="Type your question…"></textarea>
    <button id="mh-chat-send">Send</button>
  </div>
</div>

<script>
(function () {
  var API = (window.CHAT_API_BASE || "").replace(/\/+$/, "");
  var launcher = document.getElementById("mh-chat-launcher");
  var panel    = document.getElementById("mh-chat-panel");
  var closeBtn = panel.querySelector(".mh-close");
  var log      = document.getElementById("mh-chat-log");
  var input    = document.getElementById("mh-chat-input");
  var sendBtn  = document.getElementById("mh-chat-send");
  var greeted  = false;

  function toggle(open) {
    panel.classList.toggle("mh-open", open);
    if (open) {
      if (!greeted) {
        addBot("Hi! Ask me anything about the guides and I'll answer with sources. 📚");
        greeted = true;
      }
      input.focus();
    }
  }
  launcher.addEventListener("click", function () { toggle(!panel.classList.contains("mh-open")); });
  closeBtn.addEventListener("click", function () { toggle(false); });

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function addMsg(role, html) {
    var wrap = document.createElement("div");
    wrap.className = "mh-msg mh-" + role;
    wrap.innerHTML = '<div class="mh-bubble">' + html + "</div>";
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }
  function addUser(text) { return addMsg("user", esc(text)); }
  function addBot(text)  { return addMsg("bot", esc(text)); }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    var html = '<div class="mh-sources">';
    sources.forEach(function (s) {
      html +=
        "<details><summary>📄 " + esc(s.filename) +
        (s.heading ? " — " + esc(s.heading) : "") + "</summary>" +
        '<div class="mh-snippet">' + esc(s.snippet || "") + "</div></details>";
    });
    return html + "</div>";
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    if (!API || API.indexOf("REPLACE-WITH-YOUR-APP") !== -1) {
      addBot("⚠️ The widget isn't configured yet — set CHAT_API_BASE to your deployed API URL.");
      return;
    }
    addUser(text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    var typing = addMsg("bot", '<span class="mh-typing">Thinking…</span>');

    fetch(API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        typing.querySelector(".mh-bubble").innerHTML =
          esc(data.answer || "(no answer)") + renderSources(data.sources);
        log.scrollTop = log.scrollHeight;
      })
      .catch(function (err) {
        typing.querySelector(".mh-bubble").innerHTML =
          "⚠️ Sorry, something went wrong. (" + esc(err.message) + ")";
      })
      .finally(function () {
        sendBtn.disabled = false;
        input.focus();
      });
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 100) + "px";
  });
})();
</script>
