name: Build and Push

on:
  push:
    branches: [main]

# A superseded push should not sit in the queue holding a runner while a newer
# commit waits behind it -- that alone can look like a timeout.
concurrency:
  group: build-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-container:
    runs-on: ubuntu-latest
    # Explicit and well under the 6h default, so a wedged build fails fast and
    # visibly instead of burning the whole budget.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        timeout-minutes: 75
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/mommys-heart:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/mommys-heart:${{ github.sha }}
          # Reuse unchanged layers -- above all the dependency pre-build layer --
          # between runs, so only changed source is recompiled. The cache lives
          # in ACR rather than the GitHub Actions cache: a Rust dependency +
          # target layer set runs to several GB, and `type=gha` shares a hard
          # 10 GB per-repository quota that evicts it between runs, so the
          # expensive layer was being rebuilt from scratch nearly every time
          # *and* re-exported at the end of every build.
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/mommys-heart:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/mommys-heart:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
